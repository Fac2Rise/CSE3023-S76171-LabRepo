<html>
    <head>
        <title>Register User</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>Register User</h1>
        
        <div>
            <form action="processUser.jsp" method="POST">
                <label for="username">Username: </label>
                <input name="Username" id="username" required type="text"/>
                <br><br>
                
                <label for="password">Password: </label>
                <input name="Password" id="password" required type="password"/>
                <br><br>
                
                <label for="firstName">First Name: </label>
                <input name="FirstName" id="firstName" required type="text"/>
                <br><br>
                
                <label for="lastName">Last Name: </label>
                <input name="LastName" id="lastName" required type="text"/>
                <br><br>
                
                <p>
                    <input type="submit" value="Register User" id="btn"/>
                </p>
            </form>
        </div>
    </body>
</html>
