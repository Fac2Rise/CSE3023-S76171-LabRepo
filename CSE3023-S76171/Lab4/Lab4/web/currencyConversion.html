<html>
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Arial, Helvetica, sans-serif;
                background-color: #f5f5f5;
            }

            .banner {
                background-color: #f5f5f5;
                padding: 30px 20px;
                text-align: center;
                border-bottom: 1px solid #e0e0e0;
            }

            .banner h1 {
                font-size: 24px;
                font-weight: normal;
                line-height: 1.4;
                display: inline-block;
                position: relative;
                padding-left: 15px;
            }

            .banner h1::before {
                content: '';
                position: absolute;
                left: 0;
                top: 0;
                height: 100%;
                width: 4px;
                background-color: purple;
            }

            .container {
                max-width: 500px;
                margin: 50px auto;
                background: white;
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            }

            .container h2 {
                color: #333;
                margin-bottom: 25px;
                text-align: center;
                font-size: 24px;
                border-bottom: 2px solid #667eea;
                display: inline-block;
                width: auto;
                padding-bottom: 8px;
            }

            label {
                display: block;
                margin-bottom: 8px;
                font-weight: 600;
                color: #555;
                font-size: 14px;
            }

            .form-control, select {
                width: 100%;
                padding: 12px 15px;
                margin-bottom: 20px;
                border: 1px solid #ddd;
                border-radius: 6px;
                font-size: 16px;
                transition: border-color 0.3s ease;
            }

            .form-control:focus, select:focus {
                outline: none;
                border-color: #667eea;
                box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
            }

            input[type="submit"], input[type="reset"] {
                padding: 12px 24px;
                font-size: 16px;
                font-weight: 600;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                transition: all 0.3s ease;
                margin-right: 10px;
            }

            input[type="submit"], input[type="reset"] {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }

            input[type="submit"]:hover, input[type="reset"]:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            }

        </style>
    </head>
    <body>
        <div class="banner">
            <h1>Use JSP Declaration Tag, JSP Scriplet, JSP Expression <br> in Application</h1>
        </div>
        <div class="container">
            <h2>Currency Conversion</h2>
            
            <form method="POST" action="processCurrency.jsp" name="conversionForm">
                <label for="amountInput">Amount (in RM)</label>
                <input type="number" min="0" step="1" class="form-control" id="amountInput" name="amountInput">
                
                <label for="currency">Convert to</label>
                <select id="currency" name="currency">
                    <option value="1">USD</option>
                    <option value="2">EURO</option>
                    <option value="3">JPY</option>
                    <option value="4">SGD</option>
                </select>
                
                <input type="submit" value="Submit">
                <input type="reset" value="Cancel">
            </form>
        </div>
    </body>
</html>
